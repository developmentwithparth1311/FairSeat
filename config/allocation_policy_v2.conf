# Academic prototype policy. No SIH/PMIS-specific rules are verified here.
policy_version=prototype-score-v2
algorithm=candidate-proposing-deferred-acceptance
tie_break=candidate_id_ascending
seat_rule=company_capacity

# Weights must be non-negative and sum to 1.0.
weight.skills=0.50
weight.cgpa=0.30
weight.sector=0.10
weight.location=0.10

# Optional profile rules remain disabled until authoritative policy is verified.
requirement.qualifications=disabled
requirement.location=disabled
requirement.sector=disabled
exclude_prior_participants=false
